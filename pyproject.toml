[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mimictype"
version = "0.1.0"
description = "Natural Keystroke Dynamics & uinput Virtual Keyboard for Linux"
readme = "README.md"
authors = [{ name = "BlaWhi3929BD", email = "b3929@mail.ru" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "evdev>=1.6.0",
    "pyyaml>=6.0"
]

[project.scripts]
mimictype = "mimictype.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mimictype*"]

[tool.setuptools.package-data]
mimictype = ["data/*.yaml"]
